name: Déploiement GitHub Pages

on:
  # Déploie à chaque push sur la branche principale
  push:
    branches: [main]
  # Permet aussi un déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:
  # Reconstruction quotidienne (06:00 UTC) : fige dans la page les avis
  # clients publiés depuis le dernier déploiement
  schedule:
    - cron: '0 6 * * *'
    # CSA : chaque lundi à 06:17 UTC, même sans visite.
    - cron: '17 6 * * 1'

# Permissions requises pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  observatoire:
    name: Vérifier les données de l'Observatoire
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Accord du propriétaire : enregistrer les deux JSON validés sur main.
    permissions:
      contents: write
    steps:
      - name: Récupérer la dernière copie sur main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tester le mécanisme d'actualisation sans réseau
        run: node --test tests/observatoire-actualisation.test.mjs

      - name: Contrôler la source et conserver la dernière donnée valide
        env:
          FORCE_OBSERVATOIRE: ${{ github.event.schedule == '17 6 * * 1' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_OBSERVATOIRE" = "true" ]; then
            node scripts/actualiser-observatoire.mjs --force
          else
            # Rattrapage quotidien uniquement si le dernier contrôle a expiré.
            node scripts/actualiser-observatoire.mjs
          fi

      - name: Enregistrer uniquement les deux copies validées
        run: |
          git add -- public/api/observatoire.json public/api/observatoire-seed.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: vérifier les données de l’Observatoire'
          # Jamais de force-push : tout conflit ou refus sera visible dans Actions.
          git push origin HEAD:main

  build:
    name: Construire le site Astro
    needs: observatoire
    # Les avis restent reconstruits même en cas d'indisponibilité de la source CSA.
    # L'échec éventuel du job Observatoire reste visible dans le bilan Actions.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          # Inclut le nouveau commit JSON sans attendre un second push-trigger.
          ref: main
          persist-credentials: false

      - name: Installer Node 22 (requis par Astro 7)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Builder le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le dossier dist comme artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    # Sur un simple push, le job Observatoire est ignoré : sans condition explicite,
    # GitHub propage ce « skipped » et ne publie rien. On publie dès que le build a réussi.
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer l'artefact
        id: deployment
        uses: actions/deploy-pages@v4
