name: Déploiement GitHub Pages

on:
  # Déploie à chaque push sur la branche principale
  push:
    branches: [main]
  # Permet aussi un déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:
  # Reconstruction quotidienne (06:00 UTC) : fige dans la page les avis
  # clients publiés depuis le dernier déploiement
  schedule:
    - cron: '0 6 * * *'

# Permissions requises pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire le site Astro
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 22 (requis par Astro 7)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Builder le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le dossier dist comme artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer l'artefact
        id: deployment
        uses: actions/deploy-pages@v4
